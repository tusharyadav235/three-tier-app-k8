apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: three-tier-eks
  region: us-east-1

vpc:
  id: vpc-0a9c703bf400dde49 

  subnets:
    private:
      us-east-1a:
        id: subnet-0ea6837789e5f4d9a

      us-east-1b:
        id: subnet-01d84f286d830a4c3

managedNodeGroups:

  - name: three-tier-workers

    instanceType: m7i-flex.large

    desiredCapacity: 2
    minSize: 2
    maxSize: 3

    privateNetworking: true

    volumeSize: 30
    volumeType: gp3

    labels:
      role: worker
