apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: my-ap
  namespace: argocd

spec:
  project: default


  source:
    repoURL: https://github.com/tusharyadav235/three-tier-app-k8.git 
    targetRevision: main
    path: .  

    
    directory:
       recurse: true


  destination:
     server: https://kubernetes.default.svc
     namespace: production

  syncPolicy:
    automated:
       enabled: true    
